name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported
          - elixir: "1.15"
            otp: "25"
          # Latest, also runs the checks that only need one run
          - elixir: "1.18"
            otp: "27"
            lint: true
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.exs', 'mix.lock') }}

      - run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - run: mix compile --warnings-as-errors

      - name: Run tests and update spec status
        run: mix spec

      - name: Check spec/STATUS.md is up to date
        if: matrix.lint
        run: |
          if ! git diff --exit-code spec/STATUS.md; then
            echo "::error file=spec/STATUS.md::spec/STATUS.md is out of date. Run mix spec and commit the result."
            exit 1
          fi
